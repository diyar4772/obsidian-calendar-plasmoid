; qmllint settings for the plasmoid.
;
; i18n(), i18nc(), i18np() ... are provided at runtime by KLocalizedContext
; (the context object Plasma installs for applets), which qmllint can't see,
; so every translated string would be reported as unqualified access. The
; QML files avoid all other unqualified access (no reaching into parent
; files' ids); values are passed through properties instead.
[General]
DisableDefaultImports=false

[Warnings]
UnqualifiedAccess=disable
