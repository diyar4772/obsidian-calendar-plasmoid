name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Node)
    # Ubuntu's /bin/sh is dash, so the shell-quoting tests also run under dash.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  reuse:
    name: REUSE licensing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5

  lint:
    name: qmllint and translations
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Qt, KDE QML modules and gettext
        run: >
          dnf install -y --setopt=install_weak_deps=False
          nodejs qt6-qtdeclarative-devel kf6-kirigami libplasma plasma5support
          kf6-kcmutils kf6-kdeclarative kf6-ksvg gettext diffutils findutils
      - uses: actions/checkout@v4
      - run: QMLLINT=/usr/lib64/qt6/bin/qmllint scripts/lint.sh

  smoke:
    name: Load the widget (offscreen)
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Plasma, plasmoidviewer and Breeze
        run: >
          dnf install -y --setopt=install_weak_deps=False
          nodejs plasma-sdk plasma-desktop plasma5support plasma-breeze
          kf6-kirigami kf6-kcmutils kf6-kdeclarative kf6-ksvg kf6-kpackage libplasma
          qt6-qtdeclarative mesa-dri-drivers findutils dbus-daemon
      - uses: actions/checkout@v4
      - run: scripts/smoke-test.sh

  package:
    name: Build .plasmoid
    needs: [test, lint, smoke]
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        # libplasma provides the Plasma/Applet package structure for kpackagetool6.
        run: dnf install -y --setopt=install_weak_deps=False nodejs gettext zip unzip kf6-kpackage libplasma
      - uses: actions/checkout@v4
      - run: scripts/build-plasmoid.sh
      - name: Check that the package installs
        run: |
          export XDG_DATA_HOME=$(mktemp -d)
          kpackagetool6 -t Plasma/Applet -i build/*.plasmoid
          test -f "$XDG_DATA_HOME/plasma/plasmoids/io.github.diyar4772.obsidiancalendar/metadata.json"
          test -f "$XDG_DATA_HOME/plasma/plasmoids/io.github.diyar4772.obsidiancalendar/contents/locale/tr/LC_MESSAGES/plasma_applet_io.github.diyar4772.obsidiancalendar.mo"
      - uses: actions/upload-artifact@v4
        with:
          name: plasmoid
          path: build/*.plasmoid
