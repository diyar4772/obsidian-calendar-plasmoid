name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        run: dnf install -y --setopt=install_weak_deps=False nodejs gettext zip unzip kf6-kpackage libplasma
      - uses: actions/checkout@v7
      - name: Check that the tag matches metadata.json
        run: |
          version=$(node -p 'require("./package/metadata.json").KPlugin.Version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match metadata.json version $version" >&2
            exit 1
          fi
      # Fedora's nodejs package doesn't pull in npm; call the test runner directly.
      - run: node --test "tests/*.test.mjs"
      - run: scripts/build-plasmoid.sh
      - name: Check that the package installs
        run: |
          export XDG_DATA_HOME=$(mktemp -d)
          kpackagetool6 -t Plasma/Applet -i build/*.plasmoid
      - name: Release notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[.*\]: / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: build/*.plasmoid
          body_path: release-notes.md
